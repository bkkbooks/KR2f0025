body:
  text: 孫毅菴奏議詔令奏議類二奏議之屬提要臣等謹案孫毅菴奏議二卷明孫懋撰懋字德夫號毅菴慈溪人正德辛未進士官至應天府尹事迹具明史本傳懋官給事中時武宗方狎昵小人嬖幸用事言官多所謫降懋獨抗直不回如奏太監于喜史宣張澤諸疏俱能直陳無隱頗著丰采又所奏湖廣之管解綿花絨及嚴考察各條皆足補明史食貨選舉各志所未備又懋是時扈從行在其請急定平宸濠功賞又請還京屢陳邊警直指天變至千餘言亦具見忠讜其劾江彬也史言人皆為懋危而彬方日侍帝娛樂亦不之見懋以幸免亦可謂彈劾權貴奮不顧身者矣集中諸疏史但摘其大端不能備載今備録存之以與本傳相參考猶可想見其遺直也惟疏中所劾諸人刻本多劖除其姓名蓋其子孫避怨之計今無從一一考補亦姑存其舊焉乾隆四十六年十二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:f92b010de7853c13bfc90e1b86246da6af088a96768519de36134204f4bd2130
