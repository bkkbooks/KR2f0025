body:
  text: 孫毅菴奏議卷下明孫懋撰斷大義除大逆以安宗社疏臣竊以春秋之法大義滅親是非忍於親夫義有重焉不容以不滅之耳近據九江等府湖口等縣傳報緊急軍情開稱寧王壞了孫都堂又稱寧府人馬船隻隨路焚燒府縣房屋其謀危社稷之意顯著無疑已經南京內外守備衙門具本奏聞隨已分𣲖府部堂上官及臣科道官起調官兵民夫分門協力晝夜防守外但臣竊慮寧王天性不良陰謀百出一日天兵四集勢迫事危殆將卑辭上請藉口流賊祈蔽聖聰自營脫罪儻蒙不察曲加寬宥將來之禍必大可憂誠以王之包蓄異心圗竊神器自附逆瑾之時而巳然逮復護衛以來而益肆若其招納亡叛廣收盜贓殘虐居民厚積財賄上伺朝廷動靜則委任心腹往來都城殆無虛日下探地方事情則分布爪牙出入官府轉相傳報且訪得本年二三月間於蘇杭等處廣出招帖扇惑人心五六月內於湖口要津攔截客船搜取貨物凡若所為皆涉不軌今日之舉實係夙謀昔者管蔡流言周公致辟淮南作孽漢文廢之至於我朝若漢府安化王皆以謀逆誅滅宗社由是奠安伏乞皇上大奮乾斷速行誅討若南京承平之餘武備久弛所在官軍僅足防守乞敕該部會議作急推選風力憲臣老成武將統領精強士馬仍敕附近郡省若南贛都御史王守仁湖廣都御史秦金各率部下軍快土兵前來策應其江西南直𨽻等處水陸地方亦乞敕各該撫按衙門出給榜文一諭脅從諸人禍福使令解散一諭護衛官軍順逆還統都司又諭隨路地方軍民當篤念朝廷恩德勿令扇動其有謀勇出衆願行報效者許於各該統兵官處投報厚加勸賞如此則亂臣賊子刻日可擒地方生靈免遭荼毒宗廟社稷億萬年無疆之福也天下幸甚正德十四年七月初二日恤人言以安人心疏近該南京守備司禮監太監劉琅差人送到揭帖內閣為緝捕姦細以息流言造謗事正德十四年六月二十一日據守備九江等處地方署都指揮楊鋭呈報江西寧王已將孫都堂壞了事變緊急職等內外守備府部等官除會議通行具奏外竊見寧王受國厚恩正當恪遵祖訓安享王爵乃背逆天道輒興謀為不軌之心此罪大惡極天人共憤本職誓不共戴天恨不能一時就獲當行各該掌兵人員整搠軍器預備戰船及行巡城御史五城兵馬巡捕人員排門挨捕江西姦細不許一人潛住京城因而致生流言造謗加於本職除捕獲流言一十餘人全行治以軍法及具奏外為此合用揭帖前去南京吏科等衙門煩為查照知會等因臣竊照南京守備自太監黃偉而下非止一琅也緝捕姦細係多官會議而行亦非出一琅也謗者不於黃偉諸人而獨於劉琅一人乎意者琅於寧王今日雖無知謀之情平時或有交與之迹况琅昔為守備阿附逆瑾苟逃天誅今復叨職愈肆凶惡殘虐地方謗之所起厥亦有因且禦寒莫如重裘止謗莫如自修琅果自反無愧亦合退避事權以正浮議以候公論之定豈冝紛紛緝拿以拑衆口昔者周厲王患謗得衛巫使監謗者以告則殺之國人莫敢言道路以目王喜告召公曰吾能弭謗矣召公曰是障之也夫民慮之於心而宣之於口成而行之胡可壅也今王塞下之口而遂上之過恐為社稷憂今琅之所為若是不幾於塞下之口以遂已之過乎即今滿城軍民愈加惶惑防守之間前却無定夫將士安則朝廷安朝廷何惜琅一人而不以安百萬之軍民耶伏乞陛下上念祖宗重地下體軍民至情特下廷議早決宸斷即將劉琅罷居私第勿令再恭機務其姪南京錦衣衛指揮劉奇亦勿令管事守門但係本官手下家人伴當亦使各還本家生理不許妄以報效為名冒領軍器混雜軍民之中致生疑阻如此則人言以恤人心以安而琅亦得以自保矣正德十四年七月十五日専委任責成功以安地方疏邇者逆藩為變戕害忠良江西地方缺人巡撫已該廷臣會議兵部覆題請敕一道齎付都御史王守仁不妨提督軍務原任巡撫江西地方節該奉聖旨王守仁暫且準行其巡撫都御史另行推舉欽此臣竊以用人之道其未得之也固在擇之精其既得之也尤當任之專夫惟得其人而尤専其任然後可以責成功若都御史王守仁忠義自許才識逾人應變將略又其所長觀其南贛平賊之功已可概見即今變起倉卒地方實倚為重且聞本官倡義勤王衆心兢奮推誠致士羣䇿兼收欲於兩月之間期成一鼓之績得臣如此可謂擇之精矣暫令巡撫豈為任之専耶况江西地方素多盜賊非得文武備足之才不可以當保障重大之任另行推舉恐難得人伏望皇上俯納芻言特是廷議仍照該部原擬或加以總督重任請即降敕差人馬上齎付本官以示推委責成之意事寧之日仍留本官勦除黨與撫綏軍民以收平定安集之功再照浙江衢州府接連江西地方急冝防禦臣又訪得本布政司左布政使何天衢風采素著才器老成屢經巡按等官推舉亦乞量升憲職専理軍務一以內杜姦萌一以外防寇賊如此則委任専一功可責成地方可保於無虞矣正德十四年八月初四日辨忠邪核功罪以公勸懲疏邇者逆藩就擒宗社大慶仰惟朝廷論功行賞按罪示罰勸懲之典固有必行而無廢者但臣愚竊謂諸臣竭忠效勞於一時者固有足褒而先事有見於平日者亦所當録朋姦黨惡以遂其謀者固冝必誅而屈節辱身以為其用者亦不容宥請以聞見所及用舉一二為陛下言之巡撫都御史孫燧與兵備副使許逵當逆藩肇變之時聞偽傳保駕之語推明大義力抗邪謀利刃在前誓死不屈曰天無二日國無二王其精忠直氣仰貫天日雖古之忠烈不是過也守備都指揮楊鋭與安慶知府張文錦以孤虗不守之城抗方張難制之冦攻圍日急防禦益嚴援兵雖寡我師自奮卒能挫其先鋒使不得順流東下以窺南都在今之主將不多得也臣所謂竭忠效勞於一時者茲其人也先差巡視江西都御史今致仕林俊與先任江西副使今充軍胡世寧一則因王乞琉璃瓦為疏大義曰毋涉吳王几杖之賜叔假京鄙之求一則因言地方利害遂及府事曰禮樂刑政漸不出於天子凡此皆曲突徙薪之謀先任南京禮科給事中今養病徐文溥與先差江西清軍御史今降知事范輅一則因王奏復護衛屯田極言王之暴行一則因樂官秦榮毆死生員奏正其罪及議朝王禮儀凡此皆強幹弱枝之計臣所謂先事有見於平日者茲其人也至於致仕都御史李士實舉人劉養正先差江西今鎮守浙江太監畢真或公然就迎為其謀主或預圖轉遷約為應援反君事讎行若狗彘臣所謂朋姦黨惡以遂其謀者非若人耶廣西恭政季斆南昌府學教授趙承芳江西僉事潘鵬師夔或捧其偽檄而隨處招降或受其偽命而押牌管事易靣變詞曽無愧怍臣所謂屈節辱身以為其用者又非若人耶雖然數臣忠邪之辨功罪之等特舉其聞見所及言之然此逆藩積謀既久黨與必多况伺察之使絡繹都城賄賂之通途徑非一不有所懲何以警後伏乞陛下明目達聰乾剛夬決即將臣所言下之廷議忠勞如孫燧許逵楊鋭張文錦厚加恩典先見如林㑓胡世寧徐文溥范輅特起任用李士實劉養正畢真之朋姦黨惡者明正典刑季斆趙承芳潘鵬師夔之屈節辱身者勿容漏網其平日納交通賄之徒驗有贓證實迹亦必治以重罪乃若鎮巡二司等官或受其迫脅而遂與守門或被其囚繫而不免隨行其情罪之輕重較然著明南康九江等府或倉卒無備而遂至失守或急為請援而卒能克復其功過之有無自不相掩即今功成奏凱通合差委公正風力科道官前來查勘具實奏聞庶賞罰當而人心服豈惟勸戒於既往抑將激勵於方來均乞聖明留意則宗社之福臣民之幸也正德十四年八月十三日崇奬忠勤以勵人心疏竊以逆藩宸濠不軌之謀醖釀已久今日之變實關宗社竊見都御史王守仁獨先倡義興師捐軀赴難一鼓而堅城破再鼓而元惡擒自古用兵神速未有能過之者且天下之患撲之於早則易滅養之於大則難除臣聞之是時其撫按三司勇者就戮怯者坐繫無一人得免其各府州縣逺者自保近者受攻無一地得安其本處士民劫於積威舉搖手閉目亦無一人敢先出聲若非守仁忠義許國智略先人則雖有同志之士果誰為之倡率數十萬兵壯義勇亦誰為之號召齊一或者以賊鋒方鋭卒未敢當必俟逺近之兵齊至而後向敵坐使賊勢張大黨與日盛或據險拒守或散兵襲擊師旅之用恐未即已雖然風雨霜露無一氣非天今日之功孰非我皇上之功哉詩曰王猶允塞徐方既來徐方既同天子之功皇上之謂也特守仁一念忠勤為可録耳即今傳聞守仁因宸濠旬餘不食慮恐物故無以明正天討乃親押解奏凱獻俘行至浙江杭州府地方適遇欽差太監張永欲待親臨地方覆審明白具奏軍門定奪緣此未果前進且將乞恩養疾臣竊謂功成智隱雖人臣自全之道功髙厚賞實朝廷崇報之典亦所以激勵人心感發將來自古國家忠良效用緩急得人鮮不由此伏願陛下究宸濠反逆之迹鑒守仁忠勤之心急令與同太監等官張永等同心協力疾速獻俘隨定功賞以攄神人之憤以酬忠義之勳以昭國家之典若復遲阻縱使今日之事已往竊恐將來人心以守仁之奮勇伐叛為戒以環觀坐視者為得計可不慮乎况江西大亂之後撫綏懷集非守仁不可伏惟聖明留意則宗社幸甚天下幸甚正德十四年十一月初二日公糾劾以嚴考察疏竊照正德十五年復當朝覲之期朝正後例應考察臣仰惟國家令典遵用固久至於今日尤所當嚴誠以間者四方水旱頻仍或重之以師旅之事閭閻疾苦所不忍言尚冀所在上下臣僚相與奉宣德意子惠困窮庶固邦本於不搖儻復容殃民蠧政者厠其間幾何而能免於流移輾轉耶於是臣等各相詢訪公同議擬至再至三有以灼知其人決不可復用者請得次其情狀一一為陛下言之原任福建左布政使今升都御史某某刻剝軍民溪壑其欲謬膺巡撫之寄原任河南左布政使今升府尹某某出納錢糧市利為心冒居京兆之尊山東丁憂參政某某先任直𨽻徽州府知府歸裝滿載因啓逆藩之求江西丁憂參政某某原任福建漳州府知府受盜千金自取屬職之侮山東恭議某某先任武選汙濫之迹甚彰福建參議某某嘗守建寧賄賂之門大啓山西丁憂副使某某屢經論劾曽無悛改之心敢復夤緣欲肆未盡之惡湖廣副使某某因領軍而分遣白牌公行科取當出巡而特止富室明肆宣淫山東裁革副使某某兩任郡守所在貪聲有聞廣東丁憂副使某某屢掌司事多方索取無算湖廣副使某某晚節不謹居鄉互有譏評廣東僉事某某素性貪婪宰縣多侵庫藏四川僉事某某先曽巡按遼東考軍政而論價風紀索然陜西僉事某某先曽巡鹽兩淮通運使而均財鹺政大壞河南僉事某某因築城而濫行科罰陜西僉事某某任成都而夙著贓貪陜西參議某某先任僉事索取屬縣湖廣僉事某某先任經厯奔競私門浙江嚴州府知府某某縱容庫役難免通同之弊衢州府知府某某管理邉儲實多剋取之私河南懷慶府知府某某耽酒廢事况容諸子貪求山東青州府丁憂知府某某枉法受賕且縱下人為害廣西梧州府丁憂知府某某府縣薦厯貪聲遍聞雖有才奚取廣東廣州府知府某某上下和同贓貪顯著縱求薦何加廣東南雄府知府某某取諸民取諸商纍贓獨厚先任南京工部郎中今升廣西思恩軍民府知府某某管蘆洲管抽分射利偏多先任直𨽻真定府今改陜西鞏昌府知府某某夤緣復職難逃清議廣西桂林府知府某某苛虐取財斂怨地方鎮江府知府某某才力雖稱操履有虧大名府知府某某初政可觀晚節不守湖廣寶慶府知府某某厯官有年貪得無厭直𨽻寧國府起送知府某某欲償私債濫取民財長蘆運司同知某某暴行不悛貪心亦肆福建運司同知某某性習驕奢行多淫縱凡此皆不謹者也山西參政某某年力已衰詎稱旬宣之任雲南丁憂參政某某宿疾間作不無縱子為非浙江僉事某某物議紛紜兼多疾疢湖廣常德府知府某某郡事廢弛實亦衰頽山東運司運使某某衰年竊祿止足之戒罔聞江西南康府知府某某老矣専城失守之罪難免廣西潯州府知府某某廣東髙州府知府某某四川馬湖府知府某某雲南廣南府知府某某皆以衰白之年均急歸休之計凡此皆老疾者也廣西參政某某依阿有聞旬宣無補四川參議某某才識踈暗愈見昏庸貴州參議某某才識踈庸雖調簡不聞展布浙江起送僉事某某性習委靡縱别用終難振起廣東僉事某某厯官中外絶無清譽之聞四川夔州府知府某某兩任郡牧鮮有惠澤之布所謂罷軟無為者茲其人也江西副使某某原無知略兵備何勝貴州僉事某某素乏文名提學奚稱先任湖廣辰州府知府今升貴州副使某某作郡已聞闒茸安望風采之揚先任南京刑部員外郎今升廣西僉事某某斷理多見糊塗豈勝綱紀之任所謂才力不及者茲其人也雖然此特臣就其聞見所及泰者甚者為言亦多偏舉一事未盡各官殃民蠧政之實伏乞敕下吏部都察院再加詢訪如果臣所言不誣即將各官照例罷黜降調以為一時尸竊茍容之戒再照逆藩宸濠稱亂江西二司官員仗節死義惟副使許逵一人自餘若參政某某反為出謀贊畫固已明黨亂賊左布政使某某首先屈服按察使某某平素阿承僉事某某安撫九江某某招降安慶某某専與巡河雖或不出各官本意而其屈節辱身甚矣不當混列脅從輕貸其罪亦乞敕該部院將此數人先行革職為民仍監候省城委官勘報各從重處庶國法以明綱常以正而凡臣子之有懷二心者知所警矣天下幸甚正德十四年十一月二十四日急獻俘馘以彰天討以修大祀疏臣竊照逆藩宸濠隂蓄異圖積有年嵗肆今為亂逺邇騷然仰賴皇上天賜勇智神授英謀涣號親征聖武昭布由是先聲所被賊膽自寒故安慶久圍而解去九江既入而復出遂令黨與離心我師乘之一鼓而克復南昌再鼓而擒獲元惡自古帝王禁亂誅暴成功之速未有過於今日者詩曰赫赫業業有嚴天子又曰如雷如霆徐方震驚正我皇上之謂也又奚必親臨其地面縳其人而後為我皇上之功哉即今傳聞宸濠自囚繫以來或食或否瀕於死者屢矣儻一旦物故何以大彰天討再照國之大事莫重於祀而祀尤莫重於郊郊者所以大報本反始也自古聖帝明王之所甚重而不敢忽焉者也然或於二至或於四時皆有定期逮我祖宗參酌古制議定天地合祀之典每嵗正月擇日行禮先期看牲臨時齋宿情文委曲意義深逺臣伏讀大祀祝文曰時維孟春三陽開泰敬率臣僚以玉帛犧牲粢盛庶品恭祀於大祀殿備茲燎瘞然則萬世聖子神孫以似以續固不可先時而失之遽亦不當後期而失之緩也今時值暮冬去孟春之期無幾矧夫朝覲考察會試殿試又適當其期凡此皆國家求賢審官大政大事所冝次第舉行而無廢者仰惟皇上天縱聖明其有不介於衷乎夫南京係我太祖開基定鼎之地宗廟在焉陵寢在焉宸濠以始封舊藩而乃忍忘國恩敢違祖訓謀危宗社荼毒生靈臣竊意太祖在天之靈將必震怒於上亟欲明正其罪伏願皇上大奮乾斷速降明旨著落欽差太監張永等官即將首惡宸濠逆黨劉吉等牢固管押解送前來由是獻俘告廟奏凱班師以慰祖宗之靈以彰天討之威以修大祀之典如此則我皇上神功聖德已隆而益隆矣宗社幸甚天下幸甚正德十四年十二月二十八日戒不虞以保聖躬疏茲者駕幸大報恩寺修齋越數日不聞入城臣憂惶之餘即欲冒進瞽言隨於本月十七日早得聞車駕已於十六日晚旋蹕行宫歡忭間忽又傳聞皇上仍欲臨幸各寺諸處臣備員六科諫諍職也又惡得而終默默哉誠以齋醮之事非帝王所冝屑禪寂之居非帝王所冝處况夫意外之患尤不可以不防昔者宣廟欲微行大學士楊士奇諫曰陛下尊居九重恩澤豈能遍洽幽隱萬一有寃夫怨卒窺伺竊發誠不可無慮後果獲至二盜乃嘗結約候車駕之玉泉寺作亂者宣廟乃嘆曰士奇言不虛自是不復微行夫姦謀叵測在宣廟太平之時尚所不免况今以宸濠大亂之後師旅擾攘之時顧不可以不慮及此乎且舍大內不居而御督府已非杜漸防微之道又可舍督府而厯寓僧寺及諸處耶此非獨臣之所深憂雖閭巷小民亦無不憂之也伏願皇上軫垂堂之戒養居重之威端處行宫無事輕出以受臣下之朝以俟俘捷之獻如此則祖宗幸甚天下幸甚臣干冒宸嚴無任殞越戰懼之至正德十五年正月十八日披瀝愚衷懇乞回鑾疏茲者逆藩宸濠妄圖不軌恭遇皇上奉天征討駐蹕留都臣固已仰窺聖心無非所以為宗社為生靈為萬萬世無疆之大業用興有名之師為是不得已之舉也然方今仰仗天威首惡就擒餘黨悉獲所執俘囚與所收諸府子女玉帛數百餘艘就泊江干豈徒風濤衝激之虞兼有慢藏誨盜之患奏凱獻俘論功行賞非其時耶雖然今日當務之急者殆又不止是也姑舉一二言之人君所敬惟天南郊大祀之典何可以不速舉所尊惟祖太皇太后祔主之禮何可以不早行所養惟親皇太后千秋之節何可以不及時稱慶所任者庶官也考察之政雖委於吏部而黜陟幽明尚有煩夫宸斷所重者賢才也會試之事雖屬於春官而大廷賜對尤必俟夫臨軒凡此五者皆國家大典禮大政事其舉廢遲速之間實安危治忽攸繫我皇上以保有大業為心固宵旰所冝孜孜者也臣近又聞之遼左諸鎮敵衆連營霸州等處強賊嘯聚豈不以駕方逺征京師空虛將以掩吾之不備耶南自淮揚北抵順天隨路夫役迎候日久飢餓無聊或至相食况又農務之方殷耶詩曰不留不處三事就緒又曰徐方不回王曰還歸然則古昔明王之自將未嘗不以農事為重班師為急也且旬月以來暴雷震驚風霾大作災變之至厥亦有因尤不可以忽而不畏也臣待罪諫垣愚衷不勝惓惓謹用披􅅹以言伏望皇上特留睿思早降明旨即日班師啓行旋復京闕由是大明誅賞以快天下之心聿修庶政以隆國家之治實宗社生靈莫大之幸臣干冒天威無任殞越之至正德十五年四月初八日乞罷衰老不職憲臣以崇國體以厚士風疏竊照舊任巡撫兩廣某某衰老不職纍經彈劾其匿罪冒賞鑿鑿皆有證據雖嘗奉旨催取回京蓋朝廷優禮大臣禮貌當然耳某某亦當上顧國體下畏公議懇疏辭免以全晚節可也顧乃陽為乞休之章隂懷覬望之意始則徘徊道途終焉留處京邸廣務私交宿贓狼藉傳播中外貽羞搢紳邇者忽聞有旨著到任掌印管事臣交切驚愕因伏稽之國初官制具載於諸司職掌者若都察院原設左右都御史二員其後雖因巡撫地方添設不拘定額而在院管事員數一遵舊制未有加也即今本院已有左都御史王璟右都御史張綸復添置某某則為左右都御史三員隳紊舊章實自某始國體所繫為損匪輕且風俗之厚薄由大臣之倡導昔人有言大臣持祿以固寵故小臣僥幸以求進大臣貪冒而不法故小臣因緣而為姦以某之持祿固寵如是貪冒不法如是而使之茍容於朝甚非所以表百僚而厚士風也再照見任巡撫兩廣僉都御史某某素乏才猷徒長奔競往者禦賊失事僥幸脫罪復官自後濫膺巡撫専事趨時附勢縱惡容姦轉輾結納地方利病視之漠然其當時科擾貪叨之狀已備經巡按御史李素糾舉未蒙罷黜屢見轉遷方今兩廣總制之任又非各省一靣之比某復居然承乏殆所謂以蚊負山多見其不知量也雖然某之夤緣彌縫則亦不讓於某將來冒功希進之事勢所必至是又不可不早見而預杜之也臣事雖風聞言皆非誣伏乞皇上上念國體下為士風即將陳某罷黜或容自陳以全體貌蕭某行令致仕仍敕該部另推具奏簡用如此則國體以正而士風可厚矣正德十五年七月二十四日再瀝愚衷懇乞回鑾疏臣先於本年四月初八日繼於七月十一日兩經具題懇請聖駕回京俱蒙俞允始諭臣正在收拾其後復蒙諭收拾已有次第於此有以仰窺聖心惓惓思歸固已先得臣愚衷之所同然伏候之餘無任欣躍豈惟臣雖扈從將士滿城軍民亦莫不鼓舞稱慶歡聲載途即今傾聽有日未奉明旨豈以皇上思周萬務事必躬親收拾尚未完耶臣竊以君逸臣勞古今通誼小大之務各有専司果若未完即將合行事宜分命內外諸臣嚴限責成剋期班師豈不大彰宸斷大慰人心誠以宸濠大逆不道得罪天地祖宗不赦之罪詎容稽緩寢食自若倨坐舟中非所以懼亂賊也忠臣義士戮力成功大賞之典久格未行非所以勵人心也天地人君父母人子不可一日不見父母人君不可一嵗不祭天地自古帝王慎之重之南郊大祀之禮可復遲乎賢才國家器用齊民不能一日不資器用國家不能一時不須賢才前科進士選用殆盡臨軒䇿士之典可復緩乎且我皇上萬夀之辰不久屆期萬方玉帛不期自會臣伏見本年正旦適我皇上駐蹕之始未謁陵寢則未容朝賀臣民交口歌頌聖明然則今日鑾輿旋軫郊祀之禮所冝先也宗廟之禮所冝先也太皇太后祔主之禮所冝先也啓行之期又可以不預且急耶雖然此固事之至重至大者也若軍馬數萬住劄日久應給芻豆在在告乏旦夕將有不繼之憂秋髙馬肥易滋抄掠天威既逺戎心益生西北難免侵陵之擾北來章疏近雖降有明旨前後之間壅滯尚多百司何所奉行南都市廛率多官軍住歇工商廢業生理蕭條小民何以堪命况夫元凶寄泊於江滸逆黨雜繫於狴犴防衛既久人情必懈倉卒生變何以禦之臣嘗聞應天府獄南門內街往往夜驚羣喊此固人心不安憂虞之所致實亦天心仁愛譴告之有在也仰惟皇上睿炳幾先明見萬里意外之患所宜預防臣待罪言官愚衷迫切不知隱諱伏惟聖明採納早見施行以承天意以安人心實宗廟社稷莫大之幸臣無任激切願望之至正德十五年八月計處京儲以足國用疏臣近聞提督倉場尚書候觀擬奏前事聞稱京通二倉實在糧斛共計止有六百六十一萬一千餘石比照成化𢎞治年間一年共放三百四五十萬石近年每嵗多放七八十萬石糧斛日漸消耗欲會部院大臣科道等官計處查汰在京各衙門旗校軍役各處做工人役及求此外良法可以充實倉廩者伏奉聖旨這所奏計處京儲重事戶部會官議了來説欽此其後兵部尚書王瓊復題前事亦奉聖旨近年以來委的財用匱乏關係重大這所奏事情戶部看了來説欽此於此有以仰見聖明深惟國計惓惓欲厚儲蓄之至意也臣備員六科雖逺處留都無由與議茍有所見亦安敢不言以少禆國計之萬一王制曰國無九年之蓄曰不足無六年之蓄曰急無三年之蓄曰國非其國以今三倉所蓄計一年所放之外所餘無幾然則雖謂之無蓄可也若是而尚可以緩而不圖耶誠以今日國用之不足以冗食之人衆冗食之人衆以濫收旗校冒報工作之人多固其一也然昔人有言大有三冗小有三費以困天下之財今日之冗之費得無有類於是者乎此皆責在執政大臣務殫忠謀罔避嫌怨凡係今日害財蠧政之事悉用指畫具實上聞取自聖裁持以必行庶浮冗可以盡去匱急可以少紓若復疑沮於其間其如國計何至於此外良法有未容以易言蓋古者富藏於民至後世乃藏於官今則公私上下皆坐困矣於何取給哉臣竊聞近日抄沒逆黨朱寧廖鵬等家除金玉器玩不計外其見在銀兩不下千萬大約計之銀萬兩可抵米二萬石百萬兩可抵米二百萬石千萬兩可抵米二千萬石使誠用此貯之二倉則一轉移之間立見數年之積不知在廷諸臣亦嘗計及此否乎况夫近年邉境多事軍餉告乏或析其半以給邉儲宜亦無不可也臣不勝區區憂國之誠僣妄及此伏惟聖明開納特敕戶部作急會議早見施行實惟國計之幸宗社之幸正德十五年十月十三日釐夙弊以正版籍疏竊惟國家版籍之設所以具載天下州縣人丁事産人丁著戶口登耗之數事産著田賦輕重之數每十年一大造又以著前二者舊管新收開除實在之數而賦役胥此焉出名曰賦役黃册者此也故版籍正則賦役均賦役均則貧富皆得其所而天下由是平臣伏稽之祖宗立法之始版籍無不正賦役無不均貧富無不各得其所夫何法久而弊漸滋今之版籍非昔之版籍矣於此而無以釐正之欲臻均平之效胡可得耶即今大造之期伊邇謹舉聞見所及四事少救時弊萬一伏惟聖明采納施行不勝幸甚計開一曰均里甲臣惟里甲不均之弊非直人戶有多寡亦由其間貧富相去之逺耳臣先任福建建寧府浦城縣知縣該臣督造正德七年黃册查得該縣糧米除官糧外民糧總計二萬四千餘石緣先年攢造之日里書為姦富實人戶多收一甲糧米不下八千餘石貧難下戶多落七甲八甲糧米各不滿八九百石隨審得各甲田糧雖有多寡各年里役則無重輕緣是糧少甲分每遇里甲均徭之年必致傾産破家流移轉輾深用惻然當申巡按御史賀泰計欲通融區處緣泰未諳民情不允臣請仍照舊册攢造臣心終是缺然其後查照舊按復申續到巡按御史李如圭批係補偏救弊之法依擬施行等語乃取各甲糧米通加磨算多者分減少者湊補俱用糧多丁少上下民戶量其相近甲分挨次均撥務使貧富相兼各甲各不過米二千四百石之數人丁多寡大略亦同另造均平甲册封貯庫內自後但遇里甲均徭俱照前册編𣲖由是賦役得均民頗稱便臣續訪得各省直𨽻不均之弊在在有之如蒙乞敕戶部通行天下州縣今後攢造黃册務先會計丁田總數如糧滿一萬石每甲合各坐一千石丁及一萬口每甲亦各坐一千口但取州縣大數相平不必每圖一一相等如軍匠之戶有改甲者務於戶下填注原在某甲今改本甲以便清查如此則里甲均而賦役無不均矣二曰一法制臣惟法制之一者大一統之道也臣嘗署掌戶科管理後湖黃册查得北方省分開造里甲每甲自相聫屬如一甲里長趙甲其本甲甲首相連十名俱繫於趙甲之後他甲皆然遇有查理止於一十戶內檢尋其弊難隱南方省分開造里甲各甲互相依附如一甲里長錢乙其本甲至十甲甲首各揭一名雜繫於錢乙之後謂之穿甲遇有查理須於百戶之內遍閲其姦易匿且開寫上中下三等人戶此舊制也今北方人戶仍分三等南方人戶一概混列凡此豈為同軌同文之制哉况南方里書之弊比之北方尤甚不可視為不急而忽之也如蒙乞敕戶部通行天下州縣今後攢造黃册三等人戶務遵定式其穿甲之法查非舊制及見行事宜通照北方黃册開造庶國無異政家無殊俗而里書之弊亦緣是可革一二矣三曰革詭寄臣惟册籍之弊莫甚於詭寄詭寄者皆姦民豪戶買通里書或混立戶籍於畸零之內或偽除舊地於仕宦之家以脫重役以免雜差夫姦豪茍免則善良偏纍故有田以頃計而纍嵗不當一差糧僅升合而終年役於官府者比比然也非以朝廷優恤之恩反為姦豪欺罔之資耶如蒙乞勑戶部申明禁例以後攢造黃册務審老幼單丁官民田不及五畝者方許編入畸零如田及五畝以上仍收正管寄莊人戶一體當差絶戶女戶一切革除若內外仕宦之家亦必量其官職崇卑定為優免則例如京官三品以上免田四頃五品以上三頃七品以上二頃九品以上一頃外官則遞減之無田者凖田免丁如人已死優及子孫以寓世祿之意此非愚臣之見先臣大學士邱濬所著進呈大學衍義補中已備言之如此則不惟詭寄之弊可革古人所謂限民名田之意亦存乎其間矣四曰専委任臣惟任法不如任人攢造格例自洪武初年以迄於今不啻詳矣然而民偽日滋遺姦難免臣嘗監督監生查對册籍中間有除者無收有總者無撒新册之舊管多與舊册之實在不侔舊册之戶籍間與新册之軍民不合田糧之飛灑者有之埋沒者有之戶口之隱瞞者有之脫漏者有之弊病紛紛難以縷數雖經駁行改正往復經年官擾民費如同再造此皆當時任非其人人無専責之故也如蒙乞勑戶部議處慎選相應官員如各省則用右布政使或左右參政兩直𨽻則用本部郎中或員外郎平日精敏廉慎著稱者各一員坐名奏委請敕前去専一提調各屬稽革姦弊定限一年事完復命其屬監造等官俱聽察訪徑行選委所造册藉俱聽設法通行磨算查對無差然後起解進呈復命之日仍許將委過官勤惰廉貪之狀疏名舉劾以示勸懲如此庶委任専一功可責成弊可盡革矣正德十五年十二月二十六日查處久謫官員以廣聖恩疏頃值宸濠謀為不軌恭遇皇上下詔親征臣伏讀明詔有曰護衛及軍民職官先因陳奏宸濠非罪降謫者查奏起用又曰俟大功之告成將大賚於海宇欽此欽遵有以仰見皇上追念忠貞欲加顯擢大賚之行又將溥及其餘是誠聖明天寬地容之量所以赦過宥罪之至意也凡在人心孰不感激臣用是察訪乃得先曽陳奏宸濠與今逆黨者數人除按察使胡世寧布政使鄭嶽已經中外臣僚查奏起用外若先任御史今降驛丞周廣則嘗劾都督錢寧僣擬之罪先任御史今降經厯范輅則嘗奏樂官秦榮太監畢真暴橫之罪先任給事中今為民陳鼎則嘗劾錦衣衛指揮廖鵬子廖鎧冒籍取中舉人之罪此三臣者折姦宄之萌戒履霜之漸其與胡世寧鄭嶽實同心一體之人也再照宸濠謀逆之始江西三司及府州縣官僚不下百數其能抗賊不屈視死如歸者惟都御史孫燧副使許逵二人仗節死義之臣何寥寥也雖然宋臣張栻有言於犯顔敢諫中求則臨事可以得仗節死義之士若平時不能犯顔敢諫他日安能望其仗節死義乎朱熹又曰仗節死義之日當平日無事之時得而用之則足以逆折姦萌潛消禍本自然不至真有仗節死義之事非謂必知後日當有變故而預蓄此人以擬之也二臣之言可謂至論即今兵荒相仍天下多事正宜廣收忠義之士分布中外若人而顧可以少之耶臣竊嘗求之往者若編修王思給事中張原御史徐文華主事李中等近者若修撰舒芬郎中張衍瑞薑龍黃鞏孫鳯陸俸員外郎夏良勝主事萬潮林大略蔣山卿博士陳九川寺正行人等官周敘巴思明等或因事納忠失於太驟或越職言事傷於過激冒犯天威致蒙降謫計今逺者數年近者二三年矣臣竊謂諸臣罪固難逭情則可原况當堅苦刻勵之餘正其悔悟自新之日俾圖自效必有可觀伏乞皇上俯賜矜察即敕吏部通為查處前之諸臣若周廣者特加超用後之諸臣如王思如舒芬者特用召還又如陸震何遵林公黼劉概等之死有足矜者亦量加以恤典如此則忠良益勸賢才益盛大賚之典真與天地之覆載者同其廣矣天下幸甚臣無任激切仰望之至正德十六年二月二十八日端本始以興至治疏臣惟人君天下之本始即位又人君之本其始正無所為而不為正故伊尹之告太甲曰今嗣王新服厥命惟新厥德召公之戒成王曰若生子罔不在厥初生自貽哲命非以聖明嗣位端本正始固不可忽歟茲者恭遇陛下嗣統承天更化善治誕宣明詔大慰人心若朝廷政事得失天下軍民利病皆已莫能逃聖鑒矣臣草疏已成輒復中止亦知事有當先者也謹以平日所聞本始三事妄效芹曝之獻伏惟聖明採納施行其一曰養聖德臣聞人君之德惟在所養仰惟陛下春秋方冨志氣如神輔養本原正惟其時臣嘗稽古完德有道之主不獨得賢師保之助其侍御僕從罔匪正人旦夕承弼故曰僕臣正厥后克正僕臣諛厥后自聖况在今日明監未逺伏乞陛下以古為法以近事為戒師保大臣必専信任以傅德義以保身體沃心造膝不憚其煩若一應隨侍使令中官皆必謹擇老成如宋儒程頥所言年四十五已上重厚小心之人要使侈靡之物不接於目淺俗之言不入於耳如此則聞必正言見必正行所養皆善而聖德自隆矣二曰正聖學臣聞君道之大在乎稽古正學仰惟陛下繼承列聖統御萬邦必明堯舜禹湯文武之道斯可以興唐虞三代之治稽古之學所冝汲汲以有事焉者也伏乞遵用舊典早開經筵博選儒臣俾侍講讀雖然聞乎其言將見乎其行但如故事擬書二假驟讀一通恐於聖心未有得也今後講官進講宜令反覆詳説或有未明陛下俯賜清問再三詢考必待聖心洞然明悟凡聖賢之旨帝王之道以及政事之得失人臣之邪正天下之所由理亂厯代之所由廢興皆必講之明而無疑乃可行之篤而無懈此則聖學之要當務之急者也三曰勤聖政臣聞自古興衰撥亂之主未有不以憂勤為先書美髙宗曰不敢荒寧嘉靖殷邦史稱宣王曰早朝宴罷卒成中興之名以今法度縱弛之餘此正憂勤圖治之日仰惟陛下踐阼以來視朝聽政固當盡復祖宗之舊矣臣竊聞之昔者文廟嘗召六部尚書及近臣諭曰早朝四方所奏事多君臣之間不得盡所言午後事簡卿等有所欲言可從容陳論大哉皇言此萬世聖子神孫所冝體行者也伏乞陛下退朝之餘但當間暇即御便殿或於順門任聖意所注內閣部院大臣量召一二人或三四人從容延對咨訪治道若有大政則通召府部院寺堂上官及科道官會議使人各盡其謀事必求其當而後已至於在外總兵撫按方靣等官有入朝見辭者亦必召至御前俯降辭色或詢以敵國之盛衰與邉防之嚴弛或質以官吏之賢否與生民之休戚因而察其器識驗其行能如此則賢才常集於目前視聽不至於壅蔽紀綱日振法度日新中興之盛可不勞而致也雖然臣又聞之詩曰靡不有初鮮克有終易曰天行健君子以自強不息伏願陛下謹詩人之戒體大易之訓法天行健終始惟一實宗社生靈莫大之幸臣區區忠愛之誠無任仰祈之至正德十六年五月二十五日辨忠邪公舉劾以遵明詔疏恭惟陛下天縱聖明嗣位宸極明詔誕布化理維新臣伏覩詔書內一欵𢎞治十八年五月十八日以後正德十六年四月二十二日以前在京在外內外大小官員人等有因忠直諫諍及守正被害去任降調升改充軍為民等項及言事忤旨自陳致仕養病各該衙門備查明白開具事情奏請定奪欽此又奉詔書內一欵給事中御史職當言路文武官員有貪暴姦邪者務要指陳實迹糾劾欽此臣伏念備員六科以言為責前項官員雖纍經論奏前此姦臣皆務為蒙蔽或留中不出或阻抑不行公議鬱鬱莫伸忠邪之不辨久矣茲者伏遇陛下大明黜陟開廣言路任賢勿二去邪勿疑堯舜之治端有見於今日臣仰承明詔悉心查訪其忠賢之當録者除大學士費宏編修費寀已蒙起用外臣今查得先任大學士致仕劉健謝遷先任尚書致仕韓文先任編修降驛丞王思先任給事中為民今升知府致仕劉茞降驛丞張原先任御史李熙降驛丞周廣降典史今升知縣髙公韶丁憂張文明降縣丞今升知縣林有年為民徐文華先任主事降驛丞李中今升知縣戴冠皆忠諫得罪者也先任大學士致仕王鏊楊一清先任尚書致仕孫交先任都御史為民彭澤養病俞諫張嵿降副使李昆先任給事中為民陳鼎升州同知吕經今升太僕寺丞潘塤調推官王爌石天柱調判官黃臣席彖先任御史降判官俞珊董相許完今升知州張士隆降經厯范輅調知縣趙春為民李穩施儒劉士元先任評事為民沈光大先任司務降教諭今升知縣林華先任布政使致仕方良永先任副使降同知今升知府余祜降檢校胡文壁為民陳九疇先任知府降知州毛思義今升同知翟唐先任知州降經厯樊凖先任知縣為民胡守約皆守正被害者也先任都御史致仕林俊先任評事養病羅橋皆嘗言事忤旨者也以上諸臣或先朝耆舊德業並茂或一時英賢才行可稱所當任而勿二者茲其人也其姦暴之當去者除尚書等官某某等已經拿問及自陳外臣今訪得大學士某某伴食有年貪得無恥盡棄平生之學甘同流俗之歸姦回不忠焉用彼相提督倉場戶部尚書某某濫司國計惟務私交常例倍增倉儲日耗原任巡撫鳯陽都御史今升南京工部尚書某某厚賂權姦茍免譴辱地方困苦若罔聞知巡視邉城都御史某某升官必由自擇院寺迭遷保官必求私謝贓貪太濫養病國子監祭酒某某罔利務登龍斷虐害鄉人居間覬覦復起怨尤親識原任巡撫四川都御史某某貪功妄殺黷貨殃民甘以十罪自居丁憂巡撫延綏都御史某某掊克有聞保障無補實忝三邉之任巡撫保定都御史某某因解問而轉居要地自賴於錢神太常寺卿某某務夤緣而洊厯清階難逃乎物議丁憂太常寺少卿某某升官有自私債甘於代償少卿某某出身至微髙位詎容冒處南京大理寺某某治家無法持身有玷南京光祿寺卿某某屢經紏劾多方保全以上諸臣留一日則害一日之事在一方則貽一方之憂所當去而勿疑者茲其人也雖然費宏等之起用固允協人心矣數年以來有因道與時違志不茍合有如原任大學士劉忠尚書邵寶待郎章懋都御史陶琰修撰吕柟先任修撰後改升同知何瑭或引年自善或稱疾養親亦莫非人望之所屬者也某某等之拿問固大快人心矣有如工部尚書某某因督大工肆為貪得任用平日心腹武功衛千戶王選立為買辦名目専管一應物料剋落分受動以萬計嘗用在官銀二千兩託某某過送錢寧致被欺騙穢迹大彰伊男某某發身粟例營選京官纍升吏部主事謀入內閣書寫蠅營狗茍依勢罔利嵗辦課程必先厚賂方敢進納事干錢糧必經稟白方可施行加以串通鋪戶發賣批單計某某私入亦不下萬數此某之父子亦合拿問者也臣備員言官茍有所聞不敢隱默伏乞陛下俯垂聽納特賜施行如臣所舉劉健劉忠等即敕該部訪其年力盛衰應存問者遣使存問因以咨訪嘉謀應禮聘者降敕齎聘勉令光輔新政應升用者遇缺升用俾得及時展布然年逺事湮中間所遺尚多仍聽各該衙門查明聞奏如臣所劾某某等俱有實迹不係泛言尤望陛下獨奮乾斷通賜罷黜其某某父子並用事千戶某某就行拿送法司審問明白追出侵過物料贓賂坐以應得罪名以為人臣貪墨欺罔之戒天下幸甚正德十六年五月二十五日謹天戒以修人事疏臣竊聞天人之間感應如響人事失於下則天變見於上此理之常也恭惟陛下臨御以來孶孳圖治任用輔相開廣言路斥逺邪侫登進忠良聖政日新令聞四達人事之闕失臣未之見也兹者伏聞五月初一日雷擊奉天門獸吻及日精門災天威赫赫胡為而然耶臣則聞之矣人事失而變隨應者固上天仁愛之心人事得而異或見者尤天心仁愛之至况天位惟艱一念不謹或以貽四海之憂一日不謹或以致千百年之患天之所以警動陛下者殆不可謂無意也臣備員無補實切憂惶謹以所聞人事當修者七事仰塵睿覽用答天戒伏惟聖明採納施行計開一曰定聖志臣聞之君志定而天下之治成仰惟朝廷今日之政已大定矣所慮姦人或乘時妄議以疑聖心則他日之事有未可知書稱舜曰烈風雷雨弗迷伏惟陛下體天心之仁愛法帝德之罔愆聖志一定斷之不疑勿以調停之説為然勿以更張之驟為信亦勿始鋭而終怠則唐虞之治可望於今日二曰保聖躬臣聞之人君所愛莫切於身人臣亦莫切於愛君之身恭惟陛下頃以親藩入繼大統固上有宗社之靈母后之聖下有內外臣庶之衆呵護翊戴靡所不竭但臣區區蟻誠竊謂陛下聖年方妙聖質未甚充盛凡夫起居飲食之期寢興勞佚之節小大曲折備慮所冝周悉至於前後左右委任尤須得人詩曰王躬是保伏惟聖明留意三曰信詔令臣聞之詔令所以行於天下者信也詔令不信則人主之權廢矣恭惟陛下改元肆赦革故鼎新救天下深沉固結之弊為生民永逺太平之謀所在聞之歡欣鼓舞甚於更生雖漢史所稱山東布詔民之老羸癃疾扶杖往聽者殆不是過書曰令出惟行弗惟反伏乞陛下維新渙號尤懷永圖執之必堅行之惟允保信以保民實天下至切之望四曰明賞罰臣伏讀祖訓有曰凡聽訟要明不明則刑罰不中罪加良善久則天必震怒焉又曰凡賞功要當不當則人心不服久則禍必生焉欽此竊照江西宸濠之變雖已討平有日然忠義之勳未酬黨惡之罪未正若將有待然者不可不留聖意臣聞之功有髙下亦有虗實今欲賞當其功宜將隨征各官繳過文册盡行降出仍令先後紀功科道官查明開奏而冒功者必黜庶賞不僣而人人以為慶矣罪有輕重亦有真偽今欲罰當其罪宜取見獲各犯招過情由不拘成案仍聽法司官及會多官再三研審而負寃者必宥庶刑不濫而人人以為威矣五曰斥遺姦臣伏讀祖訓有曰厯代多因姑息以致姦人惑侮當未知之初一概委用既識其姦退亦何難慎勿姑息欽此竊照太監蕭敬與宸濠厯年來往已經太監張永查係書底簿籍有名人犯具奏先帝著外私宅間住所處已寬頃者忽聞司禮監太監賴義傳奉聖旨外私宅間住太監蕭敬著本監掌印照舊辦事欽此此命一下中外驚疑其於新政所繫匪小誠以宫府一體不宜異同今若起用蕭敬一人其何以處同犯諸人交結重情不宜輕縱今若不懲於既往其何以示警於將來且敬自負前罪強顔供職則亦無以取重同列展布行事伏乞陛下仰承祖訓早決宸斷縱不加罪仍令退間以釋中外之疑以昭平明之治六曰嚴內禁頃者得聞御史張翰奉敕點閘大工一日從內官監出忽見內使人等約有三五百人或拿棍棒甎石向翰圍擁撒土其守衛官軍直日旗校明見凶惡不為防護臣聞之不覺驚愕竟亦未諳其故然以皇城禁密之地而敢爾肆為凶忿其在外無忌則又可知仰惟天威震怒必有重法以處治之矣臣竊謂漸不可長事宜預防伏乞陛下在內即敕各監局等各掌印官各行嚴束所管人員各於本衙門専務本等職事不許輒出各門各路口聚衆為非違者許守衛直日官旗人等即時捉獲通將該管官員恭奏治罪其京城內外亦即敕錦衣衛及巡城御史兵馬司官嚴督官校弓兵火甲各於分管地方不限晝夜用心巡邏但有前項生事之人許即拿送法司從重問斷違者罪亦有歸七曰慎邉防臣聞之禦戎之䇿守備為上備邉之要兵食為先雖然食足則兵強是食又先於兵也即今邉餉缺乏軍士困憊一旦𤇺火有警何以驅之應敵况先該宣府報稱口外走回男婦供報彼處扶起小王子與烏蘭哈等講和及瞭報塞外兵勢下營四十餘里其意蓋非尋常侵掠之比幸遇聖明御極威靈逺震彺圖雖已大沮然亦不可忘備伏乞陛下軫念邉防之重特從廷臣之請早將各犯抄沒銀兩分給各邉以紓困急仍敕各該鎮巡總兵等官務在嚴飭將士保固疆圉以稱今日中興內修外攘之意正德十六年六月某日懇乞勉留大臣以光輔新政疏臣竊以數年權姦誤國祖宗之法度變壞幾盡天下之生民塗炭已極宗社之不危者亦幸焉而已兹者伏遇陛下聖明天啓忠良任職剗革積年所不可拔之弊力除羣黨所未易動之姦中外人民舉欣欣然謳歌鼓舞仰望太平所恃以成化致治者陛下乾乾不息於上大臣相與蹇蹇匪躬於下耳近者傳聞大學士楊廷和以弟廷儀被劾之故蔣冕以御史張鵬之言吏部尚書石珤亦因御史趙永亨之言皆相繼乞休臣不為三臣惜實不能不為國事惜也誠以當此人情積玩之餘政化維新之始法度雖修而未全惠澤雖布而未洽羣姦雖已下獄而未決者尚多正人雖已起用而赴闕者未見其姦種餘息乘間伺隙隂冀其散而復聚者蓋不知其幾也如此則調停之説必興紹述之禍且作而國家之大事去矣可不為之寒心哉臣聞之王敦雖負大惡而其弟王導不害為元輔今廷儀所坐特不職耳廷和何嫌之足避耶若蔣冕雖嘗扈從先帝留處南都事由梁儲實非獲已然薰蕕同器香臭自别言者蓋失之不察石珤遭值陛下新政擢任冡司朝野相賀方喜得人然任事未幾展施未究言者誠失之太輕矧此三臣才智德望既居天下之先文學操履亦出羣臣之右蓋無一人之可舍去亦無一日之可暫逺朝廷者也伏乞陛下特降溫旨曲賜勉留仍諭以中外公論及責之國體大義務使其位得安其志可行再照致仕大學士謝遷尚書韓文雖嘗奉旨起用一時未有員缺臣竊以二臣厯事纍朝當孝廟盛時朝政清明輔佐德業以成盛治逮武廟初年權姦紛亂伏闕死諍廢居謫籍其孤忠碩德又非其他諸臣之比今遷年逾七旬文亦躋八帙必待有缺而用或恐其年不待臣聞之宋致仕太師文彥博居洛年八十有一司馬光言其宿德元老宜起以自輔乃詔平章軍國重事班宰相上六日一朝兩月一赴經筵今朝廷起用二臣宜若可凖彥博故事不必拘夫員缺亦不必煩以職務但優其禮遇列之上班朝恭經筵日月一至若有大政大事特令參預必有嘉謀禆益新政如蒙亦乞陛下速降敕旨聘取來京與楊廷和蔣冕石珤等同心輔政以與至治實宗廟社稷之幸亦天下人心之望也正德十六年七月某日陳言疏案照先為前事各準奉本衙門關劄準南京通政使司經厯司手本奉南京兵部劄付武庫清吏司案呈案照先奉本部送準兵部咨前事內開正德十四年五月初八日該本部題準在京衛分今後仍照成化三年初定事例就令原差存恤給事中御史部屬官每年終弔取糧册清查一次如有買間作弊軍人依律參奏究問如有情弊將查過軍人總數具本查考其各衛所見役食糧軍人止於兩京兵部取數與戶部糧册查對不必徑拘各衛所比較致生阻撓若查出見役軍人與糧册不對者照依刷卷事例行拘各衛首領官吏查問回答合用紙劄於兩京刑部見收囚人紙劄內關用筆墨硃炭等項行移順天應天二府支給官錢買辦應用書寫人役行移南京國子監量撥監生一十五名應用完畢送回肄業等因到部送司已經備由案呈通行各該衙門去後今照正德十五年分例該一年一次清查之期案呈到部擬合通行等因備由轉行臣除欽遵外續準該司節次手本將取到各營並監局等處見操見役旗軍手本並調到南京戶部食糧文册與各衛所花名手本督同監生蔡瑾等一十五名逐一清查明白將查出見役軍人與糧册不對者照例行拘首領官吏人等查問回答其軍人中間有準令食糧應該當月驗差而延至下月方驗者有已經驗差就應送操而遲違一二月不送者有各營開報逃故日期在前而衛所糧册扣除在後者有為事已完支糧日久而不行當差者雖各稱有患病等項事故查無堪信文憑遽難準豁行間準該部職方清吏司手本奉本部送準兵部咨據委主事路直呈前事本部看得在京各衛所詭冒新添軍匠勇士近日俱已奉詔查革經該官吏並各犯應得罪名又已過蒙赦宥若仍照本部節次題奉欽依內事理再行清查不惟事涉重復徒取煩擾抑恐追呼逼迫人情不堪合無將本部前項二次題準清查事理俱各停止本部再行南京兵部即查南京各衛所軍匠勇士等項如果奉詔查革數多一體停止等因備行前來臣為照南京各衛所軍匠勇士見今兵部奉詔委官查革其陳言事理雖已舉行有次未盡事情亦合照例停止除將造完軍人花名文册照舊送南京兵部轉繳外今將清查過軍人數目開坐具本謹具奏聞正德十六年九月二十二日公糾劾以嚴考察疏臣仰惟祖宗以來考察京官始則間一舉行其後十年一舉又其後六年一舉所以疏數不同者非有張弛於間也蓋世道日降士習漸澆法亦緣之而益密耳方今士習之壞殆又有甚於前幸遇陛下聖明嗣統化理更新而考察之典適當其期其可比常而不加嚴哉臣切見近日兩京文職四品以上俱經自陳五品以下俱從吏部會官考察其諸不職大小臣僚顯黜者雖若巳衆茍容者不能盡無若都御史某某太常寺卿某某南京工部尚書某某大理寺卿某某光祿寺卿某某其不職罪狀已經具劾不復開外臣今訪得通政司通政某某先任兵科都給事中避劾貴幸託為養疾以自全風采何在太僕寺少卿某某先任戶科都給事中鑽求美升甘心笑罵而不顧操履可知翰林院侍講學士某某濫交無藉立社會而挾妓酣歌淫縱無忌左春坊左諭德某某連姻時宰假奕棊而為人請託貪得無算順天府府尹某某先任河南布政貪汚之行久著豈宜遽遷應天府府尹某某先任貴州布政贓賄之迹大彰何須待勘陜西巡撫都御史某某見小利而逼走驛官受私賀而納交權宰晚節頓改物議紛然此皆自陳未蒙賜罷者也南京戶部雲南司郎中某某承委買金則多侵價值驗收布匹則明通私賄南京刑部福建司郎中某某先宰程鄉既貪濁有聞繼居法曹益汚濫無檢南京工部屯田司郎中某某先任虞衡收納皮漆料價每批剋銀動盈千數太僕寺寺丞今丁憂某某嘗歷屬縣索取羣長分例每處進銀各計百餘南京戶部河南司郎中今升都勻府知府某某反目閨門貽羞里巷妄見讎於同列南京工部屯田司郎中今升廣西府知府某某年已衰頽志惟貪得甘受侮於作頭工部虞衡司郎中今升陜西參議某某先差易州已盈大欲繼出蕪湖未殄餘貪工部都水司主事某某先令永豐巳著汚名後調英山不聞改行應天府通判某某下屬催徴科害糧里况前任尤貪養病通判某某贓濫被劾夤緣茍全實當道有賴此皆考察尚在所遺者也臣再照某某等非貪則姦罪狀不為不顯屢經糾劾公論不為不明中間亦嘗奉有明旨令其自陳尋復蒙溫旨留其供職不知聖衷何以斷之於前而復遲疑於後耶豈以去者已衆將不論賢否一概姑容之耶臣聞之管子有言任賢而使小人間之害霸也夫賢不肖混淆在霸尚有所妨况今聖德中興將任衆賢以興至治而可容以小人間之哉且宋元祐之治其後變為紹聖者以熙豐之小人不盡去耳我國家去宋未遠此又今日所當取以為鑒者也臣備員耳目之任不敢不盡其聞見之實伏望陛下俯徇公議早決宸斷即將某某等通賜罷黜不必再令自陳其郎中等官某某等仍敕吏部查訪俱照不謹事例間住庶考核嚴明姦邪消沮士習可以丕變而世道將駸駸乎向隆矣正德十六年九月二十二日十分貧乏鋪行無力辦納重大紙張乞憐比例區處以便官民疏據上元江寧二縣重紙鋪戶胡璉等連名告稱身等俱於二十年前僉編重紙行頭初役未纍之先蒙派上用大料紙一百三十萬張因價浩繁無力措辦當有行頭賀瓊等告蒙分豁準召客商李崇等均同辦納蒙將食鹽銅錢支給有卷可查自後身等連年陪納消乏猶未造册更代困苦難言每班雖有貼戶數名年久逃亡僅存一二各皆貧窘近日又蒙行取前項紙張原行南京工部轉行出産去處採買今蒙仍拘身等各班辦納若不預先告鳴切思前紙價銀動經萬有餘兩身等小民不過錙銖微本亦在京畿貿易素非産有地方况前未纍之先尚難措辦而今既纍之後豈能進納晝夜驚惶竊照先年絲綿鋪戶何輔等因年例合用串五絲料價銀數多應辦不前告蒙本府將情轉奏先領價色差官前去湖州等處收買後交物料及照司馬御史亦曽奏準今後該派物料價貴數多者該部移文産有地方令其有司召商平買送部運用前項事例遵行已久今仍拘辦安敢抗違但思身等負纍日久資産既傾脂血枯耗縱加鞭撲比較未免束手待斃徒亡獄底於事無益如蒙準告伏乞憐憫生靈危迫困苦之極查照前項事例給賜價銀委官前去産有去處收買庶使商賈各有樂從之心官府亦無稽誤之纍公私兩全實為便益為此冒罪連名上告及單開貼戶賀廷蘭等三十九名俱各消乏慎廣明等四十四名俱已逃亡見存止有陳佐等三十七名等情到府卷查嘉靖十五年六月初二日該南京工部劄付為供應紙劄事內開合用大榜紙三十萬張中夾紙五十萬張奏本紙五十萬張劄行本府轉行上江二縣著落當該官吏查照先年事例即便拘集該行鋪戶到官照依街市時直從公估計白榜紙每張該價鈔若干中夾紙每張該價鈔若干奏本紙每張該價鈔若干務在兩平不致虧官損民仍將估過價鈔共計若干貫總數具由連人火速一併解部以憑轉送內府南京司禮監關填勘合赴南京天財庫關領鈔貫收買等因已經帖仰上元江寧二縣著落當該官吏照依帖文內事理即便查照先年事例拘集該行鋪戶到官照依街市時直從公估計收買去後隨於本年十月初七日據本府經厯司案呈抄蒙巡視九庫南京吏科等衙門給事中等官陳塏南京浙江道監察御史申用休等案驗為估計事據應天府上元江寧二縣手本開送委官主簿李竒章典史藍璞帶領各行鋪戶前赴會同館公同該府府尹孫懋逐一體比街市兩平從公估計明白等因計開一起為供應紙劄事合用白榜紙每張價銀二分共該銀六千兩中夾紙每百張價銀一錢二分共該銀六百兩奏本紙每張價銀三釐共該銀一千五百兩三項通共該銀八千一百兩臣等看得百金者中人十家之産也今計所直之價八千一百兩實中人八十一家之産也而况此等鋪戶原無産業止靠些須資本輾轉貿易規圖生計則又非中人之比及照南京原非産紙地方雖有一二客商興販前來多不如式且數亦不敷若所産之地在浙江則有衢州常山江西則有廣信鉛山二省府縣相去南都水陸不下二千餘里為鋪戶者資本既已不足盤費復何所資觀此其不能辦納必矣不能辦納而強之承認豈惟徒纍貧賈實恐有誤上供臣等隨查得嘉靖六年該本府府尹王爌奏據上元江寧二縣絲綿鋪戶何輔等告稱乞憐十分困苦鋪行從便處價以蘇民困事要將戶部各處解到鹽鈔銀兩不必仍令解戶買錢上納就將本色銀兩收貯本部照數給還鋪行該本部題準咨行南京戶部議得每年如遇各處照依新例解到戶口食鹽錢鈔價銀到部除鈔貫照舊支給買納上庫外其餘銅錢不必扣除餘價積買軍糧亦不必易换銅錢就將原價銀扣寄本部銀庫待候應天府遇有內府衙門用過鋪行絲料等項行移支還料價該府就具應支明文赴部關領回府支給取領附卷等因該戶部再議相應覆題奉欽依通行欽遵外再查得嘉靖拾年該南京雲南等道監察御史司馬泰等奏為條陳興革事宜以禆修省事內開一節派買以蘇鋪戶要將戶工二部該派料價先查甲字等庫所有者儘數放支如果盡紙方許派買價貴數多者該部移文齎價於産有地方責令有司召商平買送部轉發各該衙門應用不許令解人徑送以滋弊端其價賤數少者仍於兩縣派買該部即給與價直毋得稽遲守候留難該戶部題奉欽依移咨南京戶部今後一應該派物料先儘甲字等庫見貯數內明白會支若有不敷酌量貴賤移文齎價於産有地方收買送用勿纍解人或量派上元江寧二縣買辦隨即給價務使官民兩便經久可行通行遵照外今照重紙之價加倍於絲綿産有之地逺在於江浙二項價銀均之取給於食鹽錢鈔前此絲綿鋪戶乞憐困苦已蒙皇上明燭幽遐恩施浩蕩免其辦納如獲更生今茲重紙鋪行乞憐貧乏情尤懇切如蒙伏乞皇上一視同仁將臣等所言下之該部咨行南京戶工二部從長議處仍照絲綿事例量支食鹽銀兩差官一員或帶本行鋪戶一二名齎文所産地方著落該府官吏拘集抄紙人戶到官時估價直當官交易刻期完解仍於該府守取明文回部查考如此則上供之需既不致誤而下民之疸庶亦有瘳我皇上天地覆載之恩日月照臨之明已隆而益隆矣南都人民幸甚臣等幸甚嘉靖十五年十一月初九日謝恩疏嘉靖十五年十一月初四日該南京吏部辦事官張梧奏事回還齎捧欽賞銀五兩紵絲一表裏到臣當即望闕叩頭秪領訖照得臣先任河南布政使司左布政使於時扶溝縣地方強賊髙寵聚集徒衆流劫鄉村隨該巡撫右僉都御史簡霄巡按監察御史李鏞督同臣等都布按三司掌印及守巡兵備巡捕等官調集官兵民夫分投截捕攻剿不旬月內擒獲殆盡地方底寧是皆仰賴天威震攝神武布昭之所致也臣繆膺承宣之寄愧乏消弭之方負譴方深論功何有逮後臣叨升今職該御史查勘功次凡嘗同事俱獲與名茲者荷蒙皇上涣頒厚賞猥及微勞兼金發自大盈駑駘增價彩幣賁於京輔縉紳有光臣敢不益自濯磨逺遵作礪之訓勉加裁正恆存補衮之心庶幾圖效於涓埃於以少酬乎洪造臣無任瞻天仰聖惶悚感激之至嘉靖十五年十一月某日引年乞恩休致疏臣見年七十嵗原籍浙江寧波府慈溪縣人由正德六年進士除授福建建寧府浦城縣知縣欽蒙行取考選南京吏科給事中厯升廣東布政使司右恭議按察司副使因事詿誤聽理明白蒙降廣西梧州府藤縣典史尋改江西廣信府貴溪縣典史升吉安府安福縣知縣河南汝寧府光州知州山東按察司副使廣西布政使司右恭政隨調江西布政使司右參政厯升廣西按察司按察使布政使司右布政使河南布政使司左布政使以至今職臣伏念入仕二十八年纍官一十五任為才本庸受恩特厚顧犬馬之勞未效而桑榆之景已侵出入班行每慚白首仰瞻天日惟切丹心臣聞禮大夫七十而致仕及檢查得大明會典內一欵文官七十以上不能治事者許明白具奏放回致仕欽此臣今官叨大夫年滿七十氣血日虧精神漸耗揆之禮制正當退休之期揣之衰庸難塵任使之列是以夙夜憂懼身心靡寧不得不輸􅅹衷情懇乞於君父之前也伏望聖慈察臣愚悃容令休致别任賢能庶尸素之咎可以少逭而止足之道亦得自全矣臣無任感激天恩之至嘉靖七年三月二十七日孫毅菴奏議卷下
